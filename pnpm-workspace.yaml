allowBuilds:
  '@nestjs/core': true
  electron: true
  electron-winstaller: true
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - esbuild@0.28.2
  - form-data@4.0.6

overrides:
  tinypool@<2.1.2: ^2.2.0
  katex@<0.18.2: ^0.18.2
  minimatch@>=9.0.0 <11.0.1: ^11.0.1
  glob@>=9.0.0 <14.0.2: ^14.0.2
  esbuild: 0.28.2

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver

minimumReleaseAgeExcludePrune: true

allowBuilds:
  '@nestjs/core': true
  electron: true
  electron-winstaller: true
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.3'
  - vue-tsc@3.3.3
  - axios@1.18.0
  - brace-expansion@1.1.18
  - esbuild@0.28.2
  - fast-uri@3.1.5
  - form-data@4.0.6
  - js-yaml@4.3.1
  - tar@7.5.21
  - undici@6.28.0
  - undici@7.29.0

overrides:
  esbuild: 0.28.2

shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
